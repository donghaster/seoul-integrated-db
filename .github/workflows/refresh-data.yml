name: 실거래 데이터 갱신

# 국토부 실거래를 다시 받아 집계하고, 바뀐 게 있으면 커밋한다.
# main에 push되면 Vercel이 자동으로 재배포하므로 사이트가 늘 최신 상태가 된다.
on:
  schedule:
    # 매일 새벽 5시(KST) = 20:00 UTC 전날. 실거래 신고가 30일 이내라 매일 조금씩 늘어난다.
    - cron: "0 20 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행용

# 커밋을 밀어넣어야 하므로 쓰기 권한이 필요하다
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 캐시가 빈 첫 실행은 12개월치 1,500건을 처음부터 받아야 해 한 시간을 넘길 수 있다.
    # 한 번만 성공하면 그 다음부터는 이번 달치만 받으므로 몇 분이면 끝난다.
    timeout-minutes: 150
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
      # 러너에는 .cache가 없어 매번 12개월치를 새로 받는다. 429를 피하려고 천천히.
      WORKERS: "3"
      MIN_INTERVAL: "0.5"
      # 국토부가 느린 날엔 90분 안에 받은 만큼만 쓰고 나머지는 다음 실행에 넘긴다.
      # 통째로 취소돼 그날 갱신이 날아가는 것보다, 일부라도 갱신되는 편이 낫다.
      TIME_BUDGET_MIN: "90"
      # 러너는 UTC라 그냥 두면 집계 기간이 한국보다 하루 뒤처진다.
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 키 확인
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "::error::DATA_GO_KR_KEY 시크릿이 없습니다. Settings > Secrets and variables > Actions에서 등록하세요."
            exit 1
          fi

      # 원본 캐시를 재사용해 API 호출을 줄인다(월 단위 파일이라 지난달까지는 그대로 쓴다).
      # actions/cache는 저장을 job 끝(post 단계)에 하는데, 그 전에 취소·타임아웃이 나면
      # 받아둔 걸 통째로 잃는다. 그래서 복원과 저장을 나눠, 수집 직후 바로 저장한다.
      - name: 원본 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: molit-cache-
          restore-keys: |
            molit-cache-

      - name: 국토부 실거래 수집
        run: python tools/fetch_molit.py

      # 분양면적(건축물대장) — 서울 8,284곳을 하루에 다 받을 수 없어 조금씩 채운다.
      # 받아 둔 것은 .cache에 쌓이므로 다음 날 이어받는다. 급한 일이 아니라서
      # 20분만 쓰고, 실패해도 실거래 갱신까지 막지 않는다.
      # 한도는 서비스마다 따로 하루 1만 번이라 실거래 수집을 굶기지 않는다.
      - name: 분양면적 채우기
        continue-on-error: true
        env:
          SUPPLY_QUOTA_SHARE: "0.5"   # 나머지 절반은 즉석 조회용으로 남긴다
        run: python tools/fetch_supply.py --minutes 20

      # 뒤 단계가 실패하더라도 받아둔 원본은 남겨 다음 실행이 이어받게 한다
      - name: 원본 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: molit-cache-${{ github.run_id }}

      # 상권은 분기 통계라 매일 바뀌지 않지만, 새 분기가 나오면 바로 따라가도록 매번 확인한다.
      # 키가 없으면 건너뛴다 — 나머지 갱신까지 막을 이유는 없다.
      - name: 상권 수집
        continue-on-error: true
        run: |
          if [ -z "$SEOUL_OPEN_DATA_KEY" ]; then
            echo "SEOUL_OPEN_DATA_KEY 없음 — 상권은 건너뜁니다."
            exit 0
          fi
          python tools/fetch_trade.py && python tools/build_trade.py

      - name: 집계
        run: python tools/build_data.py

      # 몇 건이 들어갔는지 Actions 화면에 남긴다. 조용히 실패하면 며칠 지나도
      # 모르는데(9월 10·11일이 그랬다), 요약이 있으면 한눈에 보인다.
      - name: 요약 적기
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import io, json
          for f, name in (("docs/data/apt.js", "아파트"), ("docs/data/sangga.js", "상가·오피스텔")):
              try:
                  s = io.open(f, encoding="utf-8").read()
                  d = json.loads(s[s.index("=") + 1:].strip().rstrip(";"))
                  print(f"- {name} 실거래 **{d.get('total', 0):,}건** (구운 시각 {d.get('builtAt')})")
              except Exception as exc:
                  print(f"- {name} 읽기 실패: {exc}")
          PY

      - name: 좌표 갱신
        run: python tools/build_geo.py

      # 깨진 데이터가 커밋돼 사이트가 죽는 일을 막는다.
      # 실제로 apt.js 구조를 바꿨을 때 뉴타운 화면과 좌표 갱신이 조용히 깨진 적이 있다.
      - name: 빌드 점검
        run: python tools/check_build.py

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/index.html docs/*/index.html docs/trade
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            echo "갱신할 내용이 없었습니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "실거래 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"

          # 사람이 같은 시간에 main에 밀어 넣으면 push가 거부된다(2026-09-11 실패 원인).
          # 받아 온 자료는 남의 커밋과 겹칠 일이 없으므로, 원격을 당겨 얹고 다시 민다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공 (시도 $i회)"
              exit 0
            fi
            echo "푸시 거부 — 원격을 당겨 다시 얹는다 ($i/5)"
            git pull --rebase origin main || exit 1
            sleep $((i * 5))
          done
          echo "::error::다섯 번 시도했는데도 푸시하지 못했습니다."
          exit 1
